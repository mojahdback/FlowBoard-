<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowBoard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <!-- header -->
  <header class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">FlowBoard</h1>
    <button id="btn-new-card" class="bg-blue-600 text-white px-3 py-1 rounded">
      + Nouvelle carte
    </button>
  </header>

   <!-- Barre de filtres -->
  <section class="flex gap-2 mb-4">
    <select id="filter-priority" class="border p-1 rounded">
      <option value="">Priorité</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <select id="filter-assignee" class="border p-1 rounded">
      <option value="">Assigné</option>
      <option value="Sara">Sara</option>
      <option value="Ali">Ali</option>
    </select>

    <input id="filter-q" type="text" placeholder="Rechercher..." class="border p-1 rounded" />

    <button id="btn-reset" class="border px-3 py-1 rounded bg-white">Réinitialiser</button>
  </section>


 

  <script type="module" src="main.js"></script>
</body>
</html>
