<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowBoard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style/card.css" />
  </head>
  <body class="bg-gray-100 p-4">
    <!-- header -->
    <header class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">FlowBoard</h1>
      <button
        id="btn-new-card"
        class="bg-blue-600 text-white px-3 py-1 rounded"
      >
        + Nouvelle carte
      </button>
    </header>

    <!-- Barre de filtres -->
    <section class="flex gap-2 mb-4">
      <select id="filter-priority" class="border p-1 rounded">
        <option value="">Priorité</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <select id="filter-assignee" class="border p-1 rounded">
        <option value="">Assigné</option>
        <option value="Sara">Sara</option>
        <option value="Ali">Ali</option>
      </select>

      <input
        id="filter-q"
        type="text"
        placeholder="Rechercher..."
        class="border p-1 rounded"
      />

      <button id="btn-reset" class="border px-3 py-1 rounded bg-white">
        Réinitialiser
      </button>
    </section>

    <div id="status-message" class="mb-4"></div>

    <!-- Loading -->
    <div id="loading" class="text-center py-6 text-blue-600 font-medium">
      <span
        class="animate-spin inline-block w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full mr-2"
      ></span>
      Chargement des cartes...
    </div>

    <!-- Error -->
    <div
      id="error"
      class="bg-red-50 text-red-600 border border-red-200 rounded-lg p-4 text-sm mb-3"
    ></div>

    <!-- Retry Button -->
    <button
      id="retry"
      hidden
      class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition duration-200"
    >
      Réessayer
    </button>

    <!-- Les 3 colonnes -->
    <main id="board" class="column grid grid-cols-3 gap-4">
      <section class="bg-white p-3 rounded shadow">
        <h2 class="font-bold mb-2">À faire (<span id="count-todo">0</span>)</h2>
        <div id="col-todo" class="flex flex-col gap-2"></div>
      </section>

      <section class="bg-white p-3 rounded shadow">
        <h2 class="font-bold mb-2">
          En cours (<span id="count-doing">0</span>)
        </h2>
        <div id="col-doing" class="flex flex-col gap-2"></div>
      </section>

      <section class="bg-white p-3 rounded shadow">
        <h2 class="font-bold mb-2">Terminé (<span id="count-done">0</span>)</h2>
        <div id="col-done" class="flex flex-col gap-2"></div>
      </section>
    </main>

    <!-- the inputs add new cart -->
    <div
      id="modal"
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center"
    >
      <form
        id="card-form"
        class="bg-white p-4 rounded w-80 flex flex-col gap-2"
      >
        <h2 class="font-bold">Nouvelle carte</h2>

        <label for="title">Titre</label>
        <input id="title" name="title" class="border p-1 rounded" />
        <p id="error-title" class="text-red-600 text-sm"></p>

        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          class="border p-1 rounded"
        ></textarea>

        <label for="priority">Priorité</label>
        <select id="priority" name="priority" class="border p-1 rounded">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <label for="assignee">Assigné</label>
        <input id="assignee" name="assignee" class="border p-1 rounded" />

        <label for="status">Statut</label>
        <select id="status" name="status" class="border p-1 rounded">
          <option value="todo">À faire</option>
          <option value="doing">En cours</option>
          <option value="done">Terminé</option>
        </select>

        <div class="flex justify-end gap-2 mt-2">
          <button
            type="button"
            id="btn-cancel"
            class="border px-3 py-1 rounded"
          >
            Annuler
          </button>
          <button
            type="submit"
            class="bg-blue-600 text-white px-3 py-1 rounded"
          >
            Ajouter
          </button>
        </div>
      </form>
    </div>

    <script type="module" src="./script/ui.js"></script>
  </body>
</html>
